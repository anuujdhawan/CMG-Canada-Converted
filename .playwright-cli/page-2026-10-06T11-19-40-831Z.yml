                    - paragraph [ref=f841e295]: "Province-specific research should record the intake status, invitation method, employer conditions, wage or work-location rules, document format and any deadline because an open stream can change before the application is submitted. For regional and occupation-focused programs, the evidence should explain why the job, community, settlement plan and applicant history fit together instead of relying on a job offer without showing the surrounding facts. A nomination is not the same as permanent residence: the federal application still requires a complete record and an admissibility assessment, so identity, family, travel, medical and police documents should be prepared early. The strongest PNP comparison answers which stream is open, which evidence can be supported, whether the route is linked to Express Entry and what happens after the provincial decision, without promising that a past intake will reopen unchanged."
