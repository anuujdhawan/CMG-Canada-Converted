                - paragraph [ref=f841e276]: A provincial immigration pathway is assessed by the province or territory under its own stream rules and, where applicable, followed by a federal permanent-residence application. The stream’s occupation, job offer, language, education, work experience, settlement and connection requirements should be checked as a complete set.
                - paragraph [ref=f841e277]: Research for a Canada Provincial Nominee Program pathway should begin with the exact province or territory and stream, because a skilled-worker, employer, graduate, regional or entrepreneur stream can apply different criteria to similar applicants. Long-tail searches such as PNP eligibility in Canada, how to get a provincial nomination, PNP job-offer requirements and Express Entry-linked PNP versus base PNP should be answered with the current stream instructions rather than a national shortcut. A strong provincial nominee profile connects the occupation and NOC duties, language result, education, work experience, job offer, employer, settlement funds, legal status and genuine intention to live in the nominating province. An Express Entry-linked nomination requires the applicant to satisfy both the provincial stream and the applicable federal Express Entry program, while a non-Express Entry nomination follows the province's process before the federal permanent-residence stage.
