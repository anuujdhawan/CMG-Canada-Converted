            - paragraph [ref=f301e343]: Canadian immigration guides are research starting points for decisions about permanent residence, Express Entry, PNP, work permits, study permits, family sponsorship, visitors and refusals. The most useful guide explains the route in plain language, names the evidence and points to the official source that controls the current rule.
